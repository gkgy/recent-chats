<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark}body{font:14px -apple-system,BlinkMacSystemFont,sans-serif;margin:0;color:light-dark(#222,#eee);background:light-dark(#fff,#1d1d1d)}main{max-width:720px;margin:auto;padding:28px 24px}header{display:flex;align-items:baseline;gap:12px}h1{font-size:22px;margin:0 0 18px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid light-dark(#ccc,#555);border-radius:10px;background:transparent;color:inherit;font:inherit}#status{color:light-dark(#666,#aaa);margin:14px 0}button.row{display:block;text-align:left;width:100%;padding:14px 8px;border:0;border-bottom:1px solid light-dark(#eee,#383838);background:transparent;color:inherit;cursor:pointer;font:inherit}button.row:hover{background:light-dark(#f3f3f3,#303030)}.title{font-weight:600}.detail{font-size:12px;color:light-dark(#666,#aaa);margin-top:6px}.top{margin-left:auto;border:0;background:transparent;color:inherit;cursor:pointer}
</style></head><body><main><header><h1>最近对话</h1><button class="top" id="refresh">刷新</button></header><input id="search" type="search" placeholder="搜索对话标题或项目文件夹" aria-label="搜索对话"><div id="status">正在读取本机对话…</div><div id="list"></div></main><script>
let rpcId=0,pending=new Map(),items=[];
function request(method,params){return new Promise((resolve,reject)=>{let id=++rpcId;pending.set(id,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
window.addEventListener('message',event=>{if(event.source!==parent)return;let msg=event.data;if(!msg||msg.jsonrpc!=='2.0'||typeof msg.id!=='number')return;let p=pending.get(msg.id);if(!p)return;pending.delete(msg.id);msg.error?p.reject(msg.error):p.resolve(msg.result)});
const status=document.querySelector('#status'), list=document.querySelector('#list'),search=document.querySelector('#search');
function render(){let q=search.value.trim().toLocaleLowerCase(),filtered=items.filter(x=>(x.title+' '+x.folder).toLocaleLowerCase().includes(q));list.replaceChildren();status.textContent=`显示 ${filtered.length} 条 · 最近活动在前 · 最多 200 条`;for(let x of filtered){let b=document.createElement('button');b.className='row';let t=document.createElement('div');t.className='title';t.textContent=x.title;let d=document.createElement('div');d.className='detail';d.textContent=x.folder+' · '+new Date(x.time).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});b.append(t,d);b.addEventListener('click',async()=>{try{let r=await request('tools/call',{name:'open_chat',arguments:{id:x.id}});if(r.isError)status.textContent=r.content?.[0]?.text||'无法打开聊天'}catch(e){status.textContent='无法打开聊天，请重试'}});list.append(b)}}
async function refresh(){try{let r=await request('tools/call',{name:'list_recent_chats',arguments:{}});if(r.isError)throw Error(r.content?.[0]?.text);items=r.structuredContent.chats;render()}catch(e){status.textContent='无法读取最近对话：'+(e.message||'请重试')}}
search.addEventListener('input',render);document.querySelector('#refresh').addEventListener('click',refresh);
(async()=>{try{await request('ui/initialize',{appInfo:{name:'recent-chats',version:'1.3.0'},appCapabilities:{},protocolVersion:'2026-01-26'});parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');await refresh();setInterval(refresh,30000)}catch(e){status.textContent='无法连接最近对话服务'}})();
</script></body></html>
